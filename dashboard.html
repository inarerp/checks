<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 لوحة التحكم الموحدة</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f0f2f5;color:#1f2937;font-size:14px;line-height:1.5}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

/* Sidebar */
.sidebar{background:#0f172a;color:#e2e8f0;padding:14px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
.sidebar h1{font-size:16px;margin-bottom:14px;color:#fbbf24;border-bottom:1px solid #334155;padding-bottom:10px;text-align:center;font-weight:800}
.sidebar h2{font-size:10px;margin:14px 0 6px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.nav-menu{list-style:none;margin-bottom:10px}
.nav-item{padding:10px 12px;margin-bottom:4px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:#cbd5e1;transition:.15s;display:flex;align-items:center;gap:8px}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.active{background:#1d4ed8;color:#fff}
.sidebar button{width:100%;padding:9px 11px;border-radius:5px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font-size:12px;margin-bottom:5px;font-family:inherit;cursor:pointer;font-weight:600;text-align:right;transition:.15s}
.sidebar button:hover{background:#334155}
.sidebar button.primary{background:#3b82f6;border-color:#3b82f6}
.sidebar button.primary:hover{background:#2563eb}
.sidebar button.success{background:#059669;border-color:#059669}
.sidebar button.success:hover{background:#047857}
.sidebar button.purple{background:#7c3aed;border-color:#7c3aed}
.sidebar button.purple:hover{background:#6d28d9}

/* Main */
.main{padding:16px;overflow-y:auto;min-width:0}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.page-header h2{font-size:18px;color:#1e2937;font-weight:800}
.page-header .subtitle{color:#64748b;font-size:13px;margin-top:3px}

/* KPI Cards */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px;border-right:4px solid #3b82f6;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi .label{font-size:11px;color:#64748b;font-weight:600;margin-bottom:4px}
.kpi .value{font-size:18px;font-weight:800;color:#1e3a5f;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:10px;color:#94a3b8;margin-top:3px}
.kpi.green{border-right-color:#059669}.kpi.green .value{color:#065f46}
.kpi.orange{border-right-color:#f59e0b}.kpi.orange .value{color:#92400e}
.kpi.red{border-right-color:#dc2626}.kpi.red .value{color:#991b1b}
.kpi.purple{border-right-color:#7c3aed}.kpi.purple .value{color:#5b21b6}
.kpi.blue{border-right-color:#3b82f6}.kpi.blue .value{color:#1e40af}
.kpi.big{grid-column:span 2}
.kpi.big .value{font-size:24px}

/* Cards */
.card{background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:16px;margin-bottom:14px;border:1px solid #e2e8f0}
.card h3{font-size:14px;color:#1e2937;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #e2e8f0;font-weight:700}
.card h3.green{border-bottom-color:#059669;color:#065f46}
.card h3.purple{border-bottom-color:#7c3aed;color:#5b21b6}
.card h3.orange{border-bottom-color:#f59e0b;color:#92400e}

/* Tables */
.table-container{overflow-x:auto;-webkit-overflow-scrolling:touch}
.data-table{width:100%;border-collapse:collapse;font-size:12px;background:#fff;border:1px solid #e2e8f0;border-radius:5px;overflow:hidden;min-width:600px}
.data-table th{background:#f1f5f9;padding:8px 10px;text-align:center;font-weight:700;color:#334155;border-bottom:2px solid #cbd5e1;font-size:11px;white-space:nowrap}
.data-table td{padding:8px 10px;border-bottom:1px solid #e2e8f0;text-align:center}
.data-table tr:nth-child(even) td{background:#f8fafc}
.data-table td.num{direction:ltr;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.data-table tr.total-row td{background:#fef3c7!important;font-weight:700;border-top:2px solid #f59e0b;padding:8px 10px;color:#78350f}
.data-table tr.total-row td.num{direction:ltr;font-variant-numeric:tabular-nums}

/* Badges */
.badge{display:inline-block;padding:3px 9px;border-radius:10px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-financing{background:#dbeafe;color:#1e40af}
.badge-supply{background:#ede9fe;color:#5b21b6}
.badge-total{background:#059669;color:#fff}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:#64748b}
.empty-state h3{color:#1e2937;margin-bottom:8px;font-size:16px}
.empty-state .icon{font-size:48px;margin-bottom:10px;opacity:.5}

/* Responsive */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:relative;max-height:none}
  .main{padding:10px}
  .kpi.big{grid-column:span 1}
  .kpi-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr}
}

/* Print */
@media print{
  body{background:#fff}
  .sidebar{display:none}
  .app{grid-template-columns:1fr}
  .main{padding:0}
  .card{box-shadow:none;border:1px solid #e2e8f0}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>📊 لوحة التحكم الموحدة</h1>
    
    <h2>📈 التقارير</h2>
    <ul class="nav-menu">
      <li class="nav-item active" data-view="overview" onclick="Dashboard.switchView('overview')">🏠 نظرة عامة</li>
      <li class="nav-item" data-view="financing" onclick="Dashboard.switchView('financing')">💰 أرباح التمويل</li>
      <li class="nav-item" data-view="supply" onclick="Dashboard.switchView('supply')">📦 أرباح الشيكات</li>
      <li class="nav-item" data-view="unified" onclick="Dashboard.switchView('unified')">💎 الأرباح الموحدة</li>
    </ul>

    <h2>⚡ اختصارات سريعة</h2>
    <button class="success" onclick="window.open('financing.html', '_blank')">💰 فتح نظام التمويل</button>
    <button class="purple" onclick="window.open('index.html', '_blank')">📦 فتح نظام الشيكات</button>
    
    <h2>🎯 انتقال مباشر</h2>
    <button onclick="window.open('financing.html#customers', '_blank')">🏢 العملاء</button>
    <button onclick="window.open('financing.html#funders', '_blank')">👥 الممولين</button>
    <button onclick="window.open('financing.html#profits', '_blank')">💵 أرباحي (التمويل)</button>

    <h2>🛠️ أدوات</h2>
    <button onclick="Dashboard.exportExcel()">📊 تصدير Excel</button>
    <button onclick="window.print()">🖨️ طباعة</button>
  </aside>

  <main class="main" id="main"></main>
</div>

<script>
'use strict';

// ==========================================
// 1. مفاتيح التخزين (كما هي في النظامين)
// ==========================================
const FINANCING_STORAGE_KEY = 'financing_system_v10';
const SUPPLY_STORAGE_KEY = 'unified_finance_system_v1';

const MONTHS_AR = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

// ==========================================
// 2. أدوات مساعدة
// ==========================================
const Utils = {
  parseNum: (v) => {
    if (v === null || v === undefined || v === '') return 0;
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    const s = String(v).trim().replace(/,/g, '').replace(/،/g, '');
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  },
  round2: (n) => {
    const num = Number(n);
    if (isNaN(num) || !isFinite(num)) return 0;
    return Math.round(num * 100) / 100;
  },
  fmt: (n) => {
    if (n === null || n === undefined || isNaN(n) || !isFinite(n)) n = 0;
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  },
  esc: (s) => {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  workMonthLabel: (key) => {
    if (!key) return 'غير محدد';
    const parts = String(key).split('-');
    if (parts.length < 2) return String(key);
    const [y, m] = parts;
    const monthIndex = parseInt(m) - 1;
    if (isNaN(monthIndex) || monthIndex < 0 || monthIndex > 11) return String(key);
    return MONTHS_AR[monthIndex] + ' ' + y;
  }
};

// ==========================================
// 3. قراءة البيانات من النظامين
// ==========================================
const DataReader = {
  readFinancing: () => {
    try {
      const raw = localStorage.getItem(FINANCING_STORAGE_KEY);
      if (!raw) return { orders: [], customers: [], funders: [] };
      const parsed = JSON.parse(raw);
      return {
        orders: Array.isArray(parsed.orders) ? parsed.orders : [],
        customers: Array.isArray(parsed.customers) ? parsed.customers : [],
        funders: Array.isArray(parsed.funders) ? parsed.funders : []
      };
    } catch (e) {
      console.error('Error reading financing data:', e);
      return { orders: [], customers: [], funders: [] };
    }
  },
  
  readSupply: () => {
    try {
      const raw = localStorage.getItem(SUPPLY_STORAGE_KEY);
      if (!raw) return { checks: [], transfers: { transactions: [], purchases: [] } };
      const parsed = JSON.parse(raw);
      return {
        checks: Array.isArray(parsed.checks) ? parsed.checks : [],
        transfers: parsed.transfers || { transactions: [], purchases: [] }
      };
    } catch (e) {
      console.error('Error reading supply data:', e);
      return { checks: [], transfers: { transactions: [], purchases: [] } };
    }
  }
};

// ==========================================
// 4. حسابات التمويل
// ==========================================
const FinancingCalc = {
  customerDue: (order) => Utils.parseNum(order.financingValue) + Utils.parseNum(order.grossProfit),
  totalCollected: (order) => (order.collections || []).reduce((s, c) => s + Utils.parseNum(c.amount), 0),
  totalFunderProfit: (order) => (order.funders || []).reduce((s, f) => s + Utils.parseNum(f.profit), 0),
  ourProfit: (order) => Utils.parseNum(order.grossProfit) - FinancingCalc.totalFunderProfit(order),
  
  getStats: () => {
    const data = DataReader.readFinancing();
    const activeOrders = data.orders.filter(o => o.status !== 'draft');
    
    const totalOrders = activeOrders.length;
    const totalFinancing = activeOrders.reduce((s, o) => s + Utils.parseNum(o.financingValue), 0);
    const totalGrossProfit = activeOrders.reduce((s, o) => s + Utils.parseNum(o.grossProfit), 0);
    const totalMyProfit = activeOrders.reduce((s, o) => s + FinancingCalc.ourProfit(o), 0);
    const totalDueCustomers = activeOrders.reduce((s, o) => s + FinancingCalc.customerDue(o), 0);
    const totalCollected = activeOrders.reduce((s, o) => s + FinancingCalc.totalCollected(o), 0);
    const totalFunderProfit = activeOrders.reduce((s, o) => s + FinancingCalc.totalFunderProfit(o), 0);
    
    // تفصيل حسب الشهر
    const monthlyData = {};
    activeOrders.forEach(o => {
      const month = o.workMonth || 'غير محدد';
      if (!monthlyData[month]) {
        monthlyData[month] = { orders: 0, financing: 0, grossProfit: 0, myProfit: 0, funderProfit: 0 };
      }
      monthlyData[month].orders++;
      monthlyData[month].financing += Utils.parseNum(o.financingValue);
      monthlyData[month].grossProfit += Utils.parseNum(o.grossProfit);
      monthlyData[month].myProfit += FinancingCalc.ourProfit(o);
      monthlyData[month].funderProfit += FinancingCalc.totalFunderProfit(o);
    });
    
    return {
      totalOrders, totalFinancing, totalGrossProfit, totalMyProfit,
      totalDueCustomers, totalCollected, totalFunderProfit,
      remainingCustomers: totalDueCustomers - totalCollected,
      monthlyData
    };
  }
};

// ==========================================
// 5. حسابات الشيكات
// ==========================================
const SupplyCalc = {
  computeCheck: (chk) => {
    const checkAmount = Utils.parseNum(chk.checkAmount);
    const supply = checkAmount > 0 ? Utils.round2(checkAmount / 1.13) : 0;
    const pct13 = Utils.round2(supply * 0.13);
    const pct1 = Utils.round2(supply * 0.01);
    const vat = Utils.parseNum(chk.vat);
    const taxablePurchase = Utils.parseNum(chk.taxablePurchase);
    const taxProfit = Utils.round2(Math.max(0, supply - taxablePurchase));
    const tax225 = Utils.round2(taxProfit * 0.225);
    const remaining225 = Utils.round2(Math.max(0, tax225 - pct1));
    const buyer14 = Utils.round2(supply * 0.14);
    const buyerNet = Utils.round2(buyer14 - vat);
    
    const supplyOrders = chk.supplyOrders || [];
    const actualTotal = supplyOrders.reduce((s, x) => s + Utils.parseNum(x.actualPurchase), 0);
    const expenses = chk.expenses || [];
    const expensesTotal = expenses.reduce((s, x) => s + Utils.parseNum(x.value), 0);
    
    const actualProfit = Utils.round2(supply - actualTotal - expensesTotal - tax225);
    
    return {
      checkAmount, supply, pct13, pct1, vat, taxablePurchase,
      taxProfit, tax225, remaining225, buyer14, buyerNet,
      actualProfit, actualTotal, expensesTotal
    };
  },
  
  getStats: () => {
    const data = DataReader.readSupply();
    const checks = data.checks;
    
    const totalChecks = checks.length;
    let totalCheckAmount = 0, totalSupply = 0, totalTax225 = 0;
    let totalPct1 = 0, totalRemaining225 = 0, totalActualProfit = 0;
    let totalBuyerNet = 0;
    
    const monthlyData = {};
    
    checks.forEach(chk => {
      const c = SupplyCalc.computeCheck(chk);
      totalCheckAmount += c.checkAmount;
      totalSupply += c.supply;
      totalTax225 += c.tax225;
      totalPct1 += c.pct1;
      totalRemaining225 += c.remaining225;
      totalActualProfit += c.actualProfit;
      totalBuyerNet += c.buyerNet;
      
      const month = chk.workMonth || 'غير محدد';
      if (!monthlyData[month]) {
        monthlyData[month] = { checks: 0, checkAmount: 0, supply: 0, tax225: 0, actualProfit: 0, buyerNet: 0 };
      }
      monthlyData[month].checks++;
      monthlyData[month].checkAmount += c.checkAmount;
      monthlyData[month].supply += c.supply;
      monthlyData[month].tax225 += c.tax225;
      monthlyData[month].actualProfit += c.actualProfit;
      monthlyData[month].buyerNet += c.buyerNet;
    });
    
    return {
      totalChecks, totalCheckAmount, totalSupply, totalTax225,
      totalPct1, totalRemaining225, totalActualProfit, totalBuyerNet,
      monthlyData
    };
  }
};

// ==========================================
// 6. الواجهة (Views)
// ==========================================
const Views = {
  renderOverview: (main) => {
    const finStats = FinancingCalc.getStats();
    const supStats = SupplyCalc.getStats();
    const totalUnifiedProfit = finStats.totalMyProfit + supStats.totalActualProfit;
    
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h2>🏠 نظرة عامة</h2>
          <div class="subtitle">ملخص شامل للأرباح من النظامين</div>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi big green">
          <div class="label">💎 إجمالي الأرباح الموحدة</div>
          <div class="value">${Utils.fmt(totalUnifiedProfit)}</div>
          <div class="sub">من التمويل + الشيكات</div>
        </div>
        <div class="kpi blue">
          <div class="label">💰 أرباح التمويل</div>
          <div class="value">${Utils.fmt(finStats.totalMyProfit)}</div>
          <div class="sub">${finStats.totalOrders} عملية</div>
        </div>
        <div class="kpi purple">
          <div class="label">📦 أرباح الشيكات</div>
          <div class="value">${Utils.fmt(supStats.totalActualProfit)}</div>
          <div class="sub">${supStats.totalChecks} شيك</div>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi">
          <div class="label">📊 إجمالي التمويل</div>
          <div class="value">${Utils.fmt(finStats.totalFinancing)}</div>
        </div>
        <div class="kpi">
          <div class="label">💵 إجمالي أرباح التمويل</div>
          <div class="value">${Utils.fmt(finStats.totalGrossProfit)}</div>
        </div>
        <div class="kpi orange">
          <div class="label">⏳ المتبقي من العملاء</div>
          <div class="value">${Utils.fmt(finStats.remainingCustomers)}</div>
        </div>
        <div class="kpi">
          <div class="label">📦 إجمالي الشيكات</div>
          <div class="value">${Utils.fmt(supStats.totalCheckAmount)}</div>
        </div>
        <div class="kpi red">
          <div class="label">🧾 ضريبة 22.5%</div>
          <div class="value">${Utils.fmt(supStats.totalTax225)}</div>
        </div>
        <div class="kpi purple">
          <div class="label">🏢 مستحقات شركة المشتريات</div>
          <div class="value">${Utils.fmt(supStats.totalBuyerNet)}</div>
        </div>
      </div>

      <div class="card">
        <h3>📈 ملخص سريع</h3>
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>البند</th>
                <th>التمويل 💰</th>
                <th>الشيكات 📦</th>
                <th>الإجمالي 💎</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>عدد العمليات</strong></td>
                <td class="num">${finStats.totalOrders}</td>
                <td class="num">${supStats.totalChecks}</td>
                <td class="num">${finStats.totalOrders + supStats.totalChecks}</td>
              </tr>
              <tr>
                <td><strong>إجمالي المبالغ</strong></td>
                <td class="num">${Utils.fmt(finStats.totalFinancing)}</td>
                <td class="num">${Utils.fmt(supStats.totalCheckAmount)}</td>
                <td class="num">${Utils.fmt(finStats.totalFinancing + supStats.totalCheckAmount)}</td>
              </tr>
              <tr>
                <td><strong>إجمالي الأرباح</strong></td>
                <td class="num">${Utils.fmt(finStats.totalGrossProfit)}</td>
                <td class="num">${Utils.fmt(supStats.totalSupply)}</td>
                <td class="num">${Utils.fmt(finStats.totalGrossProfit + supStats.totalSupply)}</td>
              </tr>
              <tr class="total-row">
                <td><strong>صافي أرباحي</strong></td>
                <td class="num">${Utils.fmt(finStats.totalMyProfit)}</td>
                <td class="num">${Utils.fmt(supStats.totalActualProfit)}</td>
                <td class="num">${Utils.fmt(totalUnifiedProfit)}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    `;
  },

  renderFinancing: (main) => {
    const stats = FinancingCalc.getStats();
    const months = Object.keys(stats.monthlyData).sort();
    
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h2>💰 أرباح نظام التمويل</h2>
          <div class="subtitle">تفصيل الأرباح حسب الشهر</div>
        </div>
      </div>

      <div class="kpi-grid">
        <div class="kpi big green">
          <div class="label">💎 إجمالي أرباحي الصافية</div>
          <div class="value">${Utils.fmt(stats.totalMyProfit)}</div>
          <div class="sub">من ${stats.totalOrders} عملية</div>
        </div>
        <div class="kpi">
          <div class="label">📊 إجمالي التمويل</div>
          <div class="value">${Utils.fmt(stats.totalFinancing)}</div>
        </div>
        <div class="kpi">
          <div class="label">💵 إجمالي الربح</div>
          <div class="value">${Utils.fmt(stats.totalGrossProfit)}</div>
        </div>
        <div class="kpi orange">
          <div class="label">👥 أرباح الممولين</div>
          <div class="value">${Utils.fmt(stats.totalFunderProfit)}</div>
        </div>
        <div class="kpi green">
          <div class="label">✅ المحصّل من العملاء</div>
          <div class="value">${Utils.fmt(stats.totalCollected)}</div>
        </div>
        <div class="kpi red">
          <div class="label">⏳ المتبقي من العملاء</div>
          <div class="value">${Utils.fmt(stats.remainingCustomers)}</div>
        </div>
      </div>

      <div class="card">
        <h3 class="green">📅 تفصيل الأرباح حسب الشهر</h3>
        ${months.length === 0 ? `
          <div class="empty-state">
            <div class="icon">💰</div>
            <h3>لا توجد بيانات تمويل</h3>
            <p>افتح نظام التمويل لإضافة عمليات</p>
          </div>
        ` : `
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>الشهر</th>
                  <th>عدد العمليات</th>
                  <th>التمويل</th>
                  <th>الربح الإجمالي</th>
                  <th>أرباح الممولين</th>
                  <th>ربحي الصافي</th>
                </tr>
              </thead>
              <tbody>
                ${months.map(m => {
                  const d = stats.monthlyData[m];

                    <tr>
                      <td><strong>${Utils.workMonthLabel(m)}</strong></td>

                  <td class="num">${Utils.fmt(stats.totalFunderProfit)}</td>

                  <th>عدد الشيكات</th>
                  <th>إجمالي المبالغ</th>
                  <th>التوريد</th>
                  <th>ضريبة 22.5%</th>
                  <th>صافي الربح</th>
                </tr>
              </thead>
              <tbody>
                ${months.map(m => {
                  const d = stats.monthlyData[m];
                  return `
                    <tr>
                      <td><strong>${Utils.workMonthLabel(m)}</strong></td>
                      <td class="num">${d.checks}</td>
                      <td class="num">${Utils.fmt(d.checkAmount)}</td>

  renderUnified: (main) => {
    const finStats = FinancingCalc.getStats();
    const supStats = SupplyCalc.getStats();
    
    // دمج الأشهر من النظامين
    const allMonths = new Set([
      ...Object.keys(finStats.monthlyData),
      ...Object.keys(supStats.monthlyData)
    ]);
    const sortedMonths = Array.from(allMonths).sort();
    
    main.innerHTML = `
      <div class="page-header">
        <div>
          <h2>💎 الأرباح الموحدة</h2>
          <div class="subtitle">تقرير شامل يجمع أرباح النظامين حسب الشهر</div>

      <div class="kpi-grid">
        <div class="kpi big green">

                  <th><span class="badge badge-total">💎 الإجمالي</span></th>

              </thead>
              <tbody>

                  const fin = finStats.monthlyData[m] || { myProfit: 0 };
                  const sup = supStats.monthlyData[m] || { actualProfit: 0 };
                  const total = fin.myProfit + sup.actualProfit;
                  return `
                    <tr>
                      <td><strong>${Utils.workMonthLabel(m)}</strong></td>
                      <td class="num" style="color:#1e40af;">${Utils.fmt(fin.myProfit)}</td>

                  <td class="num">${Utils.fmt(supStats.totalActualProfit)}</td>
                  <td class="num">${Utils.fmt(finStats.totalMyProfit + supStats.totalActualProfit)}</td>
                </tr>

      <div class="card">

        <ul style="padding-right:20px;line-height:2;color:#475569;">
          <li><strong>أرباح التمويل:</strong> هي صافي ربحك بعد خصم أرباح الممولين</li>
          <li><strong>أرباح الشيكات:</strong> هي صافي الربح الفعلي بعد خصم الشراء الفعلي والمصاريف والضرائب</li>
          <li><strong>الإجمالي الموحد:</strong> هو مجموع الربحين معاً</li>
          <li>البيانات تُقرأ مباشرة من النظامين عبر <code>localStorage</code></li>
        </ul>
      </div>
    `;
  }
};

// ==========================================
// 7. التحكم الرئيسي
// ==========================================
const Dashboard = {
  currentView: 'overview',
  
  switchView: (view) => {
    Dashboard.currentView = view;
    document.querySelectorAll('.nav-item').forEach(n => 
      n.classList.toggle('active', n.dataset.view === view)
    );
    Dashboard.render();
  },
  
  render: () => {
    const main = document.getElementById('main');
    if (!main) return;
    
    switch (Dashboard.currentView) {
      case 'overview': Views.renderOverview(main); break;
      case 'financing': Views.renderFinancing(main); break;
      case 'supply': Views.renderSupply(main); break;
      case 'unified': Views.renderUnified(main); break;
      default: Views.renderOverview(main);
    }
  },
  
  exportExcel: () => {
    const finStats = FinancingCalc.getStats();
    const supStats = SupplyCalc.getStats();
    
    const allMonths = new Set([
      ...Object.keys(finStats.monthlyData),
      ...Object.keys(supStats.monthlyData)
    ]);
    const sortedMonths = Array.from(allMonths).sort();
    
    const rows = [
      ['📊 التقرير الموحد - الأرباح'],
      ['تاريخ التصدير', new Date().toLocaleString('ar-EG')],
      [],
      ['📈 ملخص عام'],
      ['البند', 'التمويل', 'الشيكات', 'الإجمالي'],
      ['عدد العمليات', finStats.totalOrders, supStats.totalChecks, finStats.totalOrders + supStats.totalChecks],
      ['إجمالي المبالغ', finStats.totalFinancing, supStats.totalCheckAmount, finStats.totalFinancing + supStats.totalCheckAmount],
      ['صافي الأرباح', finStats.totalMyProfit, supStats.totalActualProfit, finStats.totalMyProfit + supStats.totalActualProfit],
      [],
      ['📅 التفصيل الشهري'],
      ['الشهر', 'أرباح التمويل', 'أرباح الشيكات', 'الإجمالي'],
    ];
    
    sortedMonths.forEach(m => {
      const fin = finStats.monthlyData[m] || { myProfit: 0 };
      const sup = supStats.monthlyData[m] || { actualProfit: 0 };
      rows.push([
        Utils.workMonthLabel(m),
        fin.myProfit,
        sup.actualProfit,
        fin.myProfit + sup.actualProfit
      ]);
    });
    
    rows.push([]);
    rows.push(['الإجمالي الكلي', finStats.totalMyProfit, supStats.totalActualProfit, finStats.totalMyProfit + supStats.totalActualProfit]);
    
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:25}, {wch:18}, {wch:18}, {wch:18}];
    XLSX.utils.book_append_sheet(wb, ws, 'التقرير الموحد');
    XLSX.writeFile(wb, `تقرير_موحد_${new Date().toISOString().slice(0,10)}.xlsx`);
  }
};

// ==========================================
// 8. التشغيل الأولي
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
  Dashboard.render();
});
</script>
</body>
</html>
