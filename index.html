<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>النظام المالي الموحد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .main-container {
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 900px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #1e2937;
      margin-bottom: 10px;
      font-size: 28px;
    }
    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 40px;
      font-size: 14px;
    }
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .main-btn {
      padding: 30px 20px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      transition: all 0.3s;
      text-align: center;
      font-family: inherit;
    }
    .main-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .btn-dashboard { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .btn-financing { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    .btn-checks { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
    .btn-icon { font-size: 40px; display: block; margin-bottom: 10px; }
    
    .dashboard-section {
      display: none;
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #e2e8f0;
    }
    .dashboard-section.active { display: block; }
    .dashboard-title {
      font-size: 20px;
      color: #1e2937;
      margin-bottom: 20px;
      text-align: center;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .stat-card {
      background: #f8fafc;
      padding: 20px;
      border-radius: 10px;
      border-right: 4px solid #3b82f6;
    }
    .stat-label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 5px;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 800;
      color: #1e3a5f;
      direction: ltr;
      text-align: right;
    }
    .stat-card.green { border-right-color: #059669; }
    .stat-card.green .stat-value { color: #065f46; }
    .stat-card.orange { border-right-color: #f59e0b; }
    .stat-card.orange .stat-value { color: #92400e; }
    .stat-card.purple { border-right-color: #7c3aed; }
    .stat-card.purple .stat-value { color: #5b21b6; }
    
    .back-btn {
      display: block;
      margin: 20px auto 0;
      padding: 10px 30px;
      background: #64748b;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
    }
    .back-btn:hover { background: #475569; }
  </style>
</head>
<body>
  <div class="main-container">
    <h1> النظام المالي الموحد</h1>
    <p class="subtitle">اختر النظام الذي تريد الدخول إليه</p>
    
    <div class="buttons-grid" id="main-buttons">
      <button class="main-btn btn-dashboard" onclick="showDashboard()">
        <span class="btn-icon">📊</span>
        داش بورد شاملة
      </button>
      <button class="main-btn btn-financing" onclick="window.location.href='financing.html'">
        <span class="btn-icon"></span>
        نظام التمويل
      </button>
      <button class="main-btn btn-checks" onclick="window.location.href='checks.html'">
        <span class="btn-icon">📦</span>
        نظام الشيكات
      </button>
    </div>

    <!-- داش بورد شاملة (تظهر في نفس الصفحة) -->
    <div class="dashboard-section" id="dashboard-section">
      <h2 class="dashboard-title">📊 ملخص شامل</h2>
      <div class="stats-grid" id="stats-grid">
        <!-- سيتم ملؤها بالجافاسكريبت -->
      </div>
      <button class="back-btn" onclick="hideDashboard()">العودة للقائمة الرئيسية</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'unified_finance_system_v1';
    
    const fmt = (n) => {
      if (n === null || n === undefined || isNaN(n)) n = 0;
      return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };
    
    const parseNum = (v) => {
      if (v === null || v === undefined || v === '') return 0;
      if (typeof v === 'number') return isFinite(v) ? v : 0;
      const s = String(v).replace(/,/g, '').replace(/[^\d.-]/g, '');
      const n = parseFloat(s);
      return isFinite(n) ? n : 0;
    };

    const showDashboard = () => {
      document.getElementById('main-buttons').style.display = 'none';
      document.getElementById('dashboard-section').classList.add('active');
      loadDashboardData();
    };

    const hideDashboard = () => {
      document.getElementById('main-buttons').style.display = 'grid';
      document.getElementById('dashboard-section').classList.remove('active');
    };

    const loadDashboardData = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : {};
        
        // بيانات التمويل
        const financingOrders = data.financing?.orders || data.orders || [];
        const financingCustomers = data.shared?.customers || data.customers || [];
        const financingFunders = data.shared?.funders || data.funders || [];
        
        // بيانات الشيكات
        const supplyData = data.supply || data;
        const checks = supplyData.checks || [];
        const supplyOrders = supplyData.supplyOrders || [];
        const transfers = supplyData.transfers?.transactions || [];
        const expenses = supplyData.transfers?.purchases || [];

        // حسابات التمويل
        const activeOrders = financingOrders.filter(o => o.status !== 'draft');
        const totalFinancingOrders = activeOrders.length;
        const totalFinancingValue = activeOrders.reduce((s, o) => s + parseNum(o.financingValue), 0);
        const totalFinancingProfit = activeOrders.reduce((s, o) => {
          const gross = parseNum(o.grossProfit);
          const funderProfit = (o.funders || []).reduce((ss, f) => ss + parseNum(f.profit), 0);
          return s + (gross - funderProfit);
        }, 0);

        // حسابات الشيكات
        const totalChecks = checks.length;
        const totalChecksAmount = checks.reduce((s, c) => s + parseNum(c.checkAmount), 0);
        const totalSupplyOrders = supplyOrders.length;
        const totalTransfers = transfers.reduce((s, t) => s + parseNum(t.amount), 0);
        const totalExpenses = expenses.reduce((s, e) => s + parseNum(e.amount), 0);
        const buyerBalance = totalTransfers - totalExpenses;

        const statsGrid = document.getElementById('stats-grid');
        statsGrid.innerHTML = `
          <div class="stat-card">
            <div class="stat-label">💰 عمليات التمويل النشطة</div>
            <div class="stat-value">${totalFinancingOrders}</div>
          </div>
          <div class="stat-card green">
            <div class="stat-label">💵 إجمالي التمويل</div>
            <div class="stat-value">${fmt(totalFinancingValue)}</div>
          </div>
          <div class="stat-card purple">
            <div class="stat-label">📈 أرباح التمويل (صافي)</div>
            <div class="stat-value">${fmt(totalFinancingProfit)}</div>
          </div>
          <div class="stat-card orange">
            <div class="stat-label">👥 العملاء</div>
            <div class="stat-value">${financingCustomers.length}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">🤝 الممولين</div>
            <div class="stat-value">${financingFunders.length}</div>
          </div>
          <div class="stat-card green">
            <div class="stat-label">📦 عدد الشيكات</div>
            <div class="stat-value">${totalChecks}</div>
          </div>
          <div class="stat-card orange">
            <div class="stat-label">💳 إجمالي الشيكات</div>
            <div class="stat-value">${fmt(totalChecksAmount)}</div>
          </div>
          <div class="stat-card purple">
            <div class="stat-label">📋 أوامر التوريد</div>
            <div class="stat-value">${totalSupplyOrders}</div>
          </div>
          <div class="stat-card ${buyerBalance >= 0 ? 'green' : ''}" style="${buyerBalance < 0 ? 'border-right-color:#dc2626;' : ''}">
            <div class="stat-label">🏢 رصيد شركة المشتريات</div>
            <div class="stat-value" style="${buyerBalance < 0 ? 'color:#991b1b;' : ''}">${fmt(Math.abs(buyerBalance))} ${buyerBalance >= 0 ? '(لنا)' : '(علينا)'}</div>
          </div>
          <div class="stat-card" style="grid-column: span 2; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border-right: none;">
            <div class="stat-label" style="color: rgba(255,255,255,0.9);">💎 إجمالي العمليات (تمويل + شيكات)</div>
            <div class="stat-value" style="color: #fff; font-size: 32px;">${totalFinancingOrders + totalChecks}</div>
          </div>
        `;
      } catch (e) {
        console.error('Error loading dashboard:', e);
        document.getElementById('stats-grid').innerHTML = '<p style="text-align:center; color:#dc2626;">خطأ في تحميل البيانات</p>';
      }
    };
  </script>
</body>
</html>
